name: Security scan of released ScreenSight EXE

on:
  workflow_run:
    workflows: ["Build ScreenSight Windows EXE"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful Windows build run ID to scan"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  windows-defender:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Download exact EXE from selected successful build
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
          name: ScreenSight-Windows-x64
          path: scan
          github-token: ${{ github.token }}

      - name: Record identity of scanned EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path './scan/ScreenSight.exe').Path
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Host "SHA256: $actual"
          Write-Host "Size: $((Get-Item -LiteralPath $exe).Length) bytes"
          "Scanned EXE SHA256: $actual" >> $env:GITHUB_STEP_SUMMARY

      - name: Confirm Microsoft Defender is active
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Defender -ErrorAction Stop
          $status = Get-MpComputerStatus -ErrorAction Stop
          $status | Select-Object AMRunningMode,AMServiceEnabled,AntivirusEnabled,AntivirusSignatureVersion,AntivirusSignatureLastUpdated,RealTimeProtectionEnabled | Format-List
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            throw 'Microsoft Defender Antivirus is not active on this runner. No AV verdict.'
          }
          "Defender enabled: YES; signatures: $($status.AntivirusSignatureVersion)" >> $env:GITHUB_STEP_SUMMARY

      - name: Scan EXE with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path './scan/ScreenSight.exe').Path
          $scanStart = Get-Date
          Start-MpScan -ScanType CustomScan -ScanPath $exe -ErrorAction Stop
          $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
            ($_.InitialDetectionTime -ge $scanStart.AddMinutes(-1)) -or
            ((@($_.Resources) -join ' ') -like '*ScreenSight.exe*')
          })
          if ($hits.Count -gt 0) {
            $hits | Format-List * | Out-String | Write-Host
            throw "Microsoft Defender detections: $($hits.Count)"
          }
          Write-Host 'DEFENDER_SCAN_COMPLETE_NO_DETECTIONS'
          'Defender scan: no reported detections' >> $env:GITHUB_STEP_SUMMARY

  clamav:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download exact EXE from selected successful build
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
          name: ScreenSight-Windows-x64
          path: scan
          github-token: ${{ github.token }}

      - name: Record SHA256 of scanned EXE
        shell: bash
        run: |
          set -euo pipefail
          sha256sum scan/ScreenSight.exe
          echo "Scanned EXE SHA256: $(sha256sum scan/ScreenSight.exe | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Install ClamAV and update definitions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout
          clamscan --version

      - name: Scan EXE with size limits increased for PyInstaller executable
        shell: bash
        run: |
          set -euo pipefail
          clamscan --infected --scan-archive=yes --max-filesize=256M --max-scansize=512M scan/ScreenSight.exe | tee clamav-report.txt
          if grep -Eq '^Data scanned: +0 B' clamav-report.txt; then
            echo 'ClamAV did not actually scan file contents; no clean verdict may be claimed.' >&2
            exit 1
          fi
          echo 'ClamAV scan: no reported detections; data scanned > 0' >> "$GITHUB_STEP_SUMMARY"
